name: Stage packages for npm release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type STAGE to stage unpublished versions already committed on main.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-stage-production
  cancel-in-progress: false

jobs:
  stage:
    name: Stage packages for 2FA approval
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'STAGE'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: npm-production

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify release commit is on main
        run: |
          test "${GITHUB_SHA}" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain)"

      - name: Validate repository
        run: npm run check

      - name: Verify package contents
        run: npm pack --workspaces --dry-run

      - name: Stage unpublished packages
        run: npm run stage-release-packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_STAGE_TOKEN }}

      - name: Show staged packages awaiting 2FA approval
        run: npx --yes npm@12.2.0 stage list
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_STAGE_TOKEN }}
